    model_routes: {chat-lb: gpt-4o-a}
    models:
      gpt-4o-pool:
        rpm: 3
        budget:
          peak: {"1d": 0.00003}
          off_peak: {"1d": 0.00003}
  dave:
    models:
      gpt-4o: {rpm: 2}
  carol:
    models:
      gpt-4o-mini:
        budget:
          peak: {"1d": 1}
          off_peak: {"1d": 1}
  alice:
    model_routes: {chat-default: gpt-4o}
    models:
      gpt-4o: {rpm: 3}
      gpt-4o-mini:
        budget:
          peak: {"1d": 0.00001}
          off_peak: {"1d": 0.00001}
